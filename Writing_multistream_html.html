<!DOCTYPE html>
<html lang="pt-BR">
<head><base href="https://d16ilfvy4mv02r.cloudfront.net/workspaces/r1GM8oPICqreT5G001D6aun71R5V9go7/3f2e69bc-7280-4d5b-a535-df49a31c0852/files/">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MultiStream Viewer</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050a05;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      color: #fff;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 40% at 50% 0%, #00ff1511 0%, transparent 70%),
        radial-gradient(ellipse 60% 30% at 20% 100%, #00cc1108 0%, transparent 60%),
        radial-gradient(ellipse 60% 30% at 80% 100%, #00cc1108 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ══════════════════════════════
       TOP NAV BAR
    ══════════════════════════════ */
    .topbar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 7px 16px;
      border-bottom: 1px solid #00ff1530;
      background: #060d06;
      flex-shrink: 0;
    }

    .topbar-logo {
      position: absolute;
      left: 16px;
      font-size: 1.1rem;
      font-weight: 900;
      color: #00ff15;
      text-shadow: 0 0 14px #00ff1566;
      letter-spacing: 1px;
    }

    .nav-btn {
      background: #00ff1515;
      border: 1px solid #00ff1540;
      color: #00ff15;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .nav-btn:hover {
      background: #00ff1530;
      box-shadow: 0 0 10px #00ff1540;
    }

    .mode-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #00ff15;
      text-shadow: 0 0 10px #00ff1544;
      min-width: 110px;
      text-align: center;
    }

    .live-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #00ff15;
      box-shadow: 0 0 8px #00ff15;
      animation: blink 1.4s infinite;
      position: absolute;
      right: 48px;
    }
    .live-text {
      position: absolute;
      right: 16px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #00ff1599;
      letter-spacing: 1px;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

    /* ══════════════════════════════
       BODY LAYOUT
    ══════════════════════════════ */
    .body-wrap {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* ══════════════════════════════
       SIDEBAR ESQUERDA
    ══════════════════════════════ */
    .sidebar {
      width: 160px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 10px;
      background: #060d06;
      border-right: 1px solid #00ff1525;
    }

    .sidebar-logo {
      font-size: 1.3rem;
      font-weight: 900;
      color: #00ff15;
      text-shadow: 0 0 16px #00ff1577;
      letter-spacing: 2px;
      margin-bottom: 4px;
      text-align: center;
    }

    .sidebar-divider {
      height: 1px;
      background: #00ff1520;
      margin: 2px 0;
    }

    .sb-btn {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1.5px solid #00ff1550;
      background: #00ff1512;
      color: #00ff15;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      text-align: center;
    }
    .sb-btn:hover, .sb-btn.active {
      background: #00ff1528;
      box-shadow: 0 0 12px #00ff1530;
    }
    .sb-btn.notif {
      background: #00ff1520;
    }
    .sb-btn.notif.on {
      background: #00ff1535;
      box-shadow: 0 0 14px #00ff1540;
    }

    .sb-info {
      font-size: 0.68rem;
      color: #00ff1577;
      line-height: 1.5;
      text-align: center;
      margin-top: 4px;
    }

    .streamers-list {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .streamer-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 8px;
      border-radius: 7px;
      font-size: 0.73rem;
      font-weight: 600;
      color: #ccc;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.2s, border-color 0.2s;
    }
    .streamer-item:hover {
      background: #00ff1510;
      border-color: #00ff1530;
    }
    .streamer-item.focused {
      background: #00ff1518;
      border-color: #00ff1550;
      color: #00ff15;
    }
    .s-dot { width:8px; height:8px; border-radius:50%; background:#00ff15; box-shadow:0 0 5px #00ff15; flex-shrink:0; }

    /* ══════════════════════════════
       ÁREA PRINCIPAL
    ══════════════════════════════ */
    .main {
      flex: 1;
      display: flex;
      min-width: 0;
      transition: all 0.35s ease;
    }

    /* GRID */
    .grid {
      flex: 1;
      display: grid;
      gap: 8px;
      padding: 8px;
      min-width: 0;
      transition: grid-template-columns 0.4s ease;
    }

    /* Modos */
    .grid.mode-3 { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr; }
    .grid.mode-2 { grid-template-columns: repeat(2, 1fr); grid-template-rows: 1fr; }
    .grid.mode-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }

    /* ── CARD ── */
    .card {
      display: flex;
      flex-direction: column;
      border-radius: 10px;
      border: 1.5px solid #00ff1535;
      background: #080f08;
      overflow: hidden;
      box-shadow: 0 0 14px #00ff1514, inset 0 0 24px #00ff1506;
      transition: border-color 0.3s, box-shadow 0.3s, opacity 0.35s;
    }
    .card:hover {
      border-color: #00ff1599;
      box-shadow: 0 0 28px #00ff1528, inset 0 0 24px #00ff150e;
    }
    .card.hidden { display: none; }
    .card.focused {
      border-color: #00ff15bb;
      box-shadow: 0 0 32px #00ff1540;
    }

    .card-label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      font-size: 0.7rem;
      font-weight: 700;
      border-bottom: 1px solid #00ff1515;
      background: #00ff150a;
      color: #00ff15cc;
      flex-shrink: 0;
    }
    .plat-badge {
      margin-left: auto;
      font-size: 0.62rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .kick-badge { background:#00ff1522; color:#00ff15; border:1px solid #00ff1544; }

    .card-player {
      flex: 1;
      position: relative;
      min-height: 0;
    }
    .card-player iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* botão chat */
    .chat-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 8px;
      background: #00ff1510;
      color: #00ff15;
      font-size: 0.77rem;
      font-weight: 700;
      border: none;
      border-top: 1px solid #00ff1528;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .chat-btn:hover  { background: #00ff1522; color: #fff; }
    .chat-btn.active { background: #00ff1530; color: #fff; }

    /* ══════════════════════════════
       CHAT PANEL
    ══════════════════════════════ */
    .chat-panel {
      width: 0;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: #060d06;
      border-left: 1.5px solid #00ff1530;
      box-shadow: -4px 0 20px #00ff1510;
      transition: width 0.35s ease;
    }
    .chat-panel.open { width: 290px; }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 13px;
      border-bottom: 1px solid #00ff1520;
      background: #00ff150a;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .chat-title { font-size: 0.78rem; font-weight: 700; color: #00ff15bb; }
    .chat-close {
      background: none; border: none; color: #555;
      font-size: 1rem; cursor: pointer; transition: color 0.2s;
    }
    .chat-close:hover { color: #fff; }

    .chat-frame { flex: 1; width: 100%; border: none; }

    .chat-blocked {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px 16px;
      text-align: center;
      flex: 1;
    }
    .chat-blocked.show { display: flex; }
    .blocked-icon { font-size: 2rem; }
    .blocked-name { font-size: 0.95rem; font-weight: 800; color: #00ff15; }
    .blocked-msg  { font-size: 0.72rem; color: #555; line-height: 1.6; }
    .blocked-btn {
      background: #00ff1518; color: #00ff15;
      border: 1px solid #00ff1540;
      text-decoration: none;
      padding: 8px 16px; border-radius: 8px;
      font-weight: 700; font-size: 0.8rem;
      transition: background 0.2s;
    }
    .blocked-btn:hover { background: #00ff1530; color: #fff; }

    /* notif toast */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #00ff1520;
      border: 1px solid #00ff1550;
      color: #00ff15;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      transition: transform 0.3s;
      z-index: 999;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- ══ TOP BAR ══ -->
<div class="topbar">
  <span class="topbar-logo">multv</span>

  <button class="nav-btn" onclick="changeMode(-1)" title="Modo anterior">☰</button>
  <button class="nav-btn" onclick="changeMode(-1)" title="Anterior">←</button>
  <span class="mode-label" id="mode-label">Modo 3 telas</span>
  <button class="nav-btn" onclick="changeMode(1)"  title="Próximo">→</button>

  <div class="live-dot"></div>
  <span class="live-text">LIVE</span>
</div>

<!-- ══ BODY ══ -->
<div class="body-wrap">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-logo">multv</div>
    <div class="sidebar-divider"></div>

    <button class="sb-btn" id="btn-mode1" onclick="setMode(1)">Modo 1 tela</button>
    <button class="sb-btn" id="btn-mode2" onclick="setMode(2)">Modo 2 telas</button>
    <button class="sb-btn active" id="btn-mode3" onclick="setMode(3)">Modo 3 telas</button>

    <div class="sidebar-divider"></div>

    <button class="sb-btn notif" id="btn-notif" onclick="toggleNotif()">🔔 Ativar notificações</button>
    <p class="sb-info">Lives e chats carregam automaticamente.</p>

    <div class="sidebar-divider"></div>

    <!-- Lista de streamers clicáveis -->
    <div class="streamers-list">
      <div class="streamer-item" onclick="focusStream(0)" id="si-0">
        <span class="s-dot"></span> gabepeixe
      </div>
      <div class="streamer-item" onclick="focusStream(1)" id="si-1">
        <span class="s-dot"></span> coringa
      </div>
      <div class="streamer-item" onclick="focusStream(2)" id="si-2">
        <span class="s-dot"></span> brabox
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="grid mode-3" id="grid">

      <!-- ① gabepeixe -->
      <div class="card" id="card-0">
        <div class="card-label">
          🟢 gabepeixe
          <span class="plat-badge kick-badge">KICK</span>
        </div>
        <div class="card-player">
          <iframe src="https://player.kick.com/gabepeixe?autoplay=true"
            allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <button class="chat-btn" onclick="openChat('gabepeixe','kick',event)">💬 Abrir chat</button>
      </div>

      <!-- ② coringa -->
      <div class="card" id="card-1">
        <div class="card-label">
          🟢 coringa
          <span class="plat-badge kick-badge">KICK</span>
        </div>
        <div class="card-player">
          <iframe src="https://player.kick.com/coringa?autoplay=true"
            allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <button class="chat-btn" onclick="openChat('coringa','kick',event)">💬 Abrir chat</button>
      </div>

      <!-- ③ brabox -->
      <div class="card" id="card-2">
        <div class="card-label">
          🟢 brabox
          <span class="plat-badge kick-badge">KICK</span>
        </div>
        <div class="card-player">
          <iframe src="https://player.kick.com/brabox?autoplay=true"
            allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <button class="chat-btn" onclick="openChat('brabox','kick',event)">💬 Abrir chat</button>
      </div>

    </div>

    <!-- CHAT PANEL -->
    <div class="chat-panel" id="chat-panel">
      <div class="chat-header">
        <span class="chat-title" id="chat-title">💬 Chat</span>
        <button class="chat-close" onclick="closeChat()">✕</button>
      </div>
      <iframe class="chat-frame" id="chat-frame" src="about:blank"
        sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-top-navigation"></iframe>
      <div class="chat-blocked" id="chat-blocked">
        <div class="blocked-icon">💬</div>
        <p class="blocked-name" id="blocked-name"></p>
        <p class="blocked-msg">A Kick bloqueia chat em iframes.<br/>Abra em uma janela separada:</p>
        <a class="blocked-btn" id="blocked-link" href="#" target="_blank">↗ Abrir chat na Kick</a>
      </div>
    </div>
  </div>
</div>

<!-- Toast notificação -->
<div class="toast" id="toast"></div>

<script>
  const domain = window.location.hostname || 'localhost';

  /* ══ MODOS ══ */
  const modes = [1, 2, 3];
  let currentMode = 3;
  let focusedStream = -1; // qual stream está em foco no modo 1

  const streamers = [
    { name: 'gabepeixe', platform: 'kick' },
    { name: 'coringa',   platform: 'kick' },
    { name: 'brabox',    platform: 'kick' },
  ];

  function setMode(n) {
    currentMode = n;
    const grid = document.getElementById('grid');
    grid.className = `grid mode-${n}`;
    document.getElementById('mode-label').textContent = `Modo ${n} tela${n > 1 ? 's' : ''}`;

    // Botões sidebar
    [1,2,3].forEach(i => {
      document.getElementById(`btn-mode${i}`).classList.toggle('active', i === n);
    });

    // Mostra/oculta cards
    for (let i = 0; i < 3; i++) {
      const card = document.getElementById(`card-${i}`);
      if (n === 3) {
        card.classList.remove('hidden');
      } else if (n === 2) {
        card.classList.toggle('hidden', i >= 2);
      } else {
        // modo 1: mostra só o focado (ou o 0 por padrão)
        const show = (focusedStream >= 0) ? i === focusedStream : i === 0;
        card.classList.toggle('hidden', !show);
      }
    }
  }

  function changeMode(dir) {
    const idx = modes.indexOf(currentMode);
    const next = modes[(idx + dir + modes.length) % modes.length];
    setMode(next);
  }

  function focusStream(idx) {
    focusedStream = idx;
    // Destaca item na sidebar
    document.querySelectorAll('.streamer-item').forEach((el, i) => {
      el.classList.toggle('focused', i === idx);
    });
    // Destaca card
    document.querySelectorAll('.card').forEach((el, i) => {
      el.classList.toggle('focused', i === idx);
    });
    // Se estiver em modo 1, reaplica para mostrar o card certo
    if (currentMode === 1) setMode(1);
  }

  /* ══ CHAT ══ */
  let currentChat = null;

  function openChat(channel, platform, ev) {
    const panel   = document.getElementById('chat-panel');
    const frame   = document.getElementById('chat-frame');
    const title   = document.getElementById('chat-title');
    const blocked = document.getElementById('chat-blocked');
    const bName   = document.getElementById('blocked-name');
    const bLink   = document.getElementById('blocked-link');

    if (currentChat === channel && panel.classList.contains('open')) {
      closeChat(); return;
    }

    let chatUrl = platform === 'kick'
      ? `https://kick.com/${channel}/chatroom`
      : `https://www.twitch.tv/embed/${channel}/chat?parent=${domain}&darkpopout`;

    frame.style.display = 'block';
    blocked.classList.remove('show');
    frame.src = chatUrl;
    title.textContent = `💬 ${channel}`;
    currentChat = channel;

    document.querySelectorAll('.chat-btn').forEach(b => b.classList.remove('active'));
    ev.currentTarget.classList.add('active');
    panel.classList.add('open');

    if (platform === 'kick') {
      clearTimeout(window._chatTimer);
      window._chatTimer = setTimeout(() => {
        try {
          const doc = frame.contentDocument || frame.contentWindow.document;
          const body = doc.body?.innerText || '';
          if (body.trim().startsWith('{') || body.trim() === '') {
            frame.style.display = 'none';
            bName.textContent = channel;
            bLink.href = `https://kick.com/${channel}`;
            blocked.classList.add('show');
          }
        } catch(e) { /* cross-origin = carregou ok */ }
      }, 4000);
    }
  }

  function closeChat() {
    const panel = document.getElementById('chat-panel');
    panel.classList.remove('open');
    document.querySelectorAll('.chat-btn').forEach(b => b.classList.remove('active'));
    currentChat = null;
    setTimeout(() => {
      document.getElementById('chat-frame').src = 'about:blank';
      document.getElementById('chat-frame').style.display = 'block';
      document.getElementById('chat-blocked').classList.remove('show');
    }, 350);
  }

  /* ══ NOTIFICAÇÕES ══ */
  let notifOn = false;
  function toggleNotif() {
    const btn = document.getElementById('btn-notif');
    if (!notifOn && 'Notification' in window) {
      Notification.requestPermission().then(p => {
        notifOn = p === 'granted';
        btn.textContent = notifOn ? '🔔 Notificações ON' : '🔕 Bloqueado';
        btn.classList.toggle('on', notifOn);
        showToast(notifOn ? '✅ Notificações ativadas!' : '❌ Permissão negada pelo navegador');
      });
    } else {
      notifOn = !notifOn;
      btn.textContent = notifOn ? '🔔 Notificações ON' : '🔔 Ativar notificações';
      btn.classList.toggle('on', notifOn);
      showToast(notifOn ? '✅ Notificações ativadas!' : '🔕 Notificações desativadas');
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
